# Pipeline job wrapping 01_bbox_demo_pipeline on serverless (README §1.2 / §3).
# seed_sample_pdfs copies src/sample_pdfs into the pdfs volume, then the pipeline
# runs parse -> extract -> flatten/normalize -> validate.
resources:
  jobs:
    bbox_demo_pipeline:
      name: bbox_demo_pipeline
      description: ai_parse_document + ai_extract (citations) -> normalized bbox tables for the bbox citation demo app
      max_concurrent_runs: 1
      tasks:
        - task_key: seed_sample_pdfs
          notebook_task:
            notebook_path: ../src/notebooks/00_seed_sample_pdfs.py
            base_parameters:
              sample_pdf_dir: ${workspace.file_path}/src/sample_pdfs
              source_volume: /Volumes/${var.catalog}/${resources.schemas.bbox_schema.name}/${resources.volumes.pdfs.name}/

        - task_key: bbox_demo_pipeline
          depends_on:
            - task_key: seed_sample_pdfs
          notebook_task:
            notebook_path: ../src/notebooks/01_bbox_demo_pipeline.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.bbox_schema.name}
              source_volume: /Volumes/${var.catalog}/${resources.schemas.bbox_schema.name}/${resources.volumes.pdfs.name}/
              image_volume_path: /Volumes/${var.catalog}/${resources.schemas.bbox_schema.name}/${resources.volumes.bbox_demo_page_images.name}/
