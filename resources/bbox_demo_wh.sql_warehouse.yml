# SQL warehouse used by the app for reads and Option 3/4 writes (README §1.4).
resources:
  sql_warehouses:
    bbox_demo_wh:
      name: ${var.warehouse_name}
      cluster_size: 2X-Small
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10
      enable_serverless_compute: true
      enable_photon: true
      warehouse_type: PRO
      spot_instance_policy: COST_OPTIMIZED
